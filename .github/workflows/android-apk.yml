name: Android APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build debug or release APK
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      gradle_task:
        description: Optional single Gradle task. Leave empty for assembleDebug/assembleRelease.
        required: false
        default: ""
      module:
        description: Optional module name, for example app. Leave empty for root task.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      GRADLE_TASK_INPUT: ${{ github.event.inputs.gradle_task || '' }}
      MODULE_INPUT: ${{ github.event.inputs.module || '' }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Print build environment
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | tail -n 5 || true
          ls "$ANDROID_HOME/build-tools" | tail -n 5 || true

      - name: Build with Gradle
        run: bash scripts/run-android-build.sh

      - name: Collect and sign APKs
        if: success()
        run: bash scripts/collect-and-sign-apks.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.BUILD_TYPE }}
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
