name: Android APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build debug or release APK
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      gradle_task:
        description: Optional single Gradle task. Leave empty for assembleDebug/assembleRelease.
        required: false
        default: ""
      module:
        description: Optional module name, for example app. Leave empty for root task.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      GRADLE_TASK_INPUT: ${{ github.event.inputs.gradle_task || '' }}
      MODULE_INPUT: ${{ github.event.inputs.module || '' }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Print build environment
        run: |
          set -euo pipefail
          java -version
          gradle -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build with Gradle
        run: |
          set -euo pipefail

          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="$(command -v gradle || true)"
          fi

          if [ -z "${GRADLE_CMD}" ]; then
            echo "No Gradle command found." | tee build-log.txt
            exit 2
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          BUILD_TYPE="${BUILD_TYPE:-debug}"
          TASK="${GRADLE_TASK_INPUT:-}"
          MODULE="${MODULE_INPUT:-}"

          if [ -z "$TASK" ]; then
            if [ "$BUILD_TYPE" = "release" ]; then
              TASK="assembleRelease"
            else
              TASK="assembleDebug"
            fi
          fi

          if [[ "$TASK" == *" "* ]]; then
            echo "Only one Gradle task is allowed. Received: $TASK" | tee build-log.txt
            exit 2
          fi

          if [ -n "$MODULE" ] && [[ "$TASK" != :* ]] && [[ "$TASK" != *:* ]]; then
            TASK=":${MODULE}:${TASK}"
          fi

          echo "Running: $GRADLE_CMD --no-daemon $TASK --stacktrace" | tee build-log.txt
          set -o pipefail
          "$GRADLE_CMD" --no-daemon "$TASK" --stacktrace 2>&1 | tee -a build-log.txt

      - name: Collect and sign APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk

          mapfile -t APKS < <(find . -path "*/build/outputs/apk/*.apk" -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            mapfile -t APKS < <(find . -path "*/build/outputs/apk/*/*.apk" -type f | sort)
          fi

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK files found under build/outputs/apk." | tee -a build-log.txt
            exit 1
          fi

          BUILD_TYPE="${BUILD_TYPE:-debug}"
          HAS_RELEASE_SECRETS="false"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            HAS_RELEASE_SECRETS="true"
          fi

          if [ "$BUILD_TYPE" != "release" ] || [ "$HAS_RELEASE_SECRETS" != "true" ]; then
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "Release keystore secrets are missing. Uploading the APK produced by Gradle without extra signing." | tee -a build-log.txt
            fi

            for apk in "${APKS[@]}"; do
              cp "$apk" "artifacts/apk/$(basename "$apk")"
            done
            exit 0
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/android-release.keystore"
          printf "%s" "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "zipalign or apksigner was not found in Android build-tools." | tee -a build-log.txt
            exit 1
          fi

          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"

          for apk in "${APKS[@]}"; do
            base="$(basename "$apk" .apk)"
            aligned="artifacts/apk/${base}-aligned.apk"
            signed="artifacts/apk/${base}-signed.apk"

            "$ZIPALIGN" -p -f 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --out "$signed" \
              "$aligned"

            "$APKSIGNER" verify --verbose "$signed" | tee -a build-log.txt
            rm -f "$aligned"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.BUILD_TYPE }}
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
